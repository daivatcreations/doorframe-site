<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B78"/>
      <stop offset="1" stop-color="#E5203A"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4EA"/>
      <stop offset="1" stop-color="#FFE3CC"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <!-- door frame -->
  <path d="M300 1024 V190 a28 28 0 0 1 28 -28 H696 a28 28 0 0 1 28 28 V1024" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linejoin="round"/>
  <!-- open door leaf -->
  <path d="M356 1024 V218 H668 V1024 Z" fill="url(#door)" opacity="0.25"/>
  <!-- pencil marks on the frame -->
  <g stroke="#7A0F1E" stroke-width="16" stroke-linecap="round">
    <line x1="636" y1="780" x2="760" y2="780"/>
    <line x1="636" y1="640" x2="760" y2="640"/>
    <line x1="636" y1="500" x2="760" y2="500"/>
  </g>
  <!-- the newest mark, highlighted -->
  <line x1="600" y1="370" x2="780" y2="370" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <circle cx="780" cy="370" r="30" fill="#FFFFFF"/>
</svg>
